name: Bug report
description: Report something in Jeb that is not working as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. If it is a security problem, do not open an issue: use private vulnerability reporting instead (see [SECURITY.md](https://github.com/clevyr/jeb/blob/main/SECURITY.md)).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps that lead to the problem, if you know them.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Jeb version
      description: Shown by `jebctl status` or the menu bar item.
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 15.4
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: jebctl doctor output
      description: Paste the output of `jebctl doctor` (or `~/.jeb/bin/jebctl doctor`).
      render: text
    validations:
      required: false
  - type: checkboxes
    id: doctor-fix
    attributes:
      label: Before you submit
      options:
        - label: I ran `jebctl doctor --fix` (or Jeb will not install at all) and the problem is still there
          required: true
