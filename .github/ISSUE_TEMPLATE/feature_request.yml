name: Feature request
description: Suggest an idea or an improvement for Jeb
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false
